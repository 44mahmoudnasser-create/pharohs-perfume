# Supabase CLI configuration for LOCAL development (`supabase start`).
# It does not change your hosted project. Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "pharohs-perfume"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the Postgres major version of your hosted project (Dashboard → Settings → Infrastructure).
major_version = 17

[db.seed]
# Dev-only demo data; applied by `supabase db reset`, never by `supabase db push`.
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Anyone who signs up gets an INACTIVE account until an admin activates it.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
